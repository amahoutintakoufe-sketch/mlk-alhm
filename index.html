<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صوت صدى الهم - المنبه الملكي المتعدد</title>
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00ff66;
            --terminal-dark: #003311;
            --border-glow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(0, 20, 5, 0.9);
            border: 2px solid var(--terminal-green);
            box-shadow: var(--border-glow);
            padding: 25px;
            border-radius: 10px;
            width: 450px;
            text-align: center;
        }

        .logo-title {
            font-size: 1.3rem;
            color: #fff;
            text-shadow: 0 0 10px var(--terminal-green);
            margin-bottom: 5px;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--terminal-green);
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .clock-display {
            font-size: 2rem;
            margin: 15px 0;
            background: #000;
            border: 1px dashed var(--terminal-green);
            padding: 8px;
            letter-spacing: 2px;
        }

        .section {
            margin: 15px 0;
            border-top: 1px solid var(--terminal-dark);
            padding-top: 10px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }

        input[type="time"], input[type="file"] {
            background: #000;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 6px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        button {
            background: var(--terminal-dark);
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 3px;
            transition: 0.2s;
        }

        button:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 8px var(--terminal-green);
        }

        /* قائمة المنبهات المضافة */
        .alarms-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--terminal-dark);
            padding: 5px;
            text-align: right;
        }

        .alarm-item {
            background: #001105;
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .alarm-item button {
            background: #ff0055;
            border-color: #ff0055;
            color: #fff;
            padding: 3px 8px;
            font-size: 0.75rem;
        }

        /* زر الإيقاف الكبير عند الرنين */
        #wakeUpContainer {
            display: none;
            margin-top: 15px;
            background: rgba(255, 0, 85, 0.2);
            border: 2px dashed #ff0055;
            padding: 15px;
            border-radius: 8px;
            animation: blink 0.8s infinite alternate;
        }

        #wakeUpStopBtn {
            width: 100%;
            background: #ff0055;
            color: #fff;
            border: 2px solid #fff;
            font-size: 1.1rem;
            padding: 12px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 0 20px #ff0055;
            font-family: inherit;
            font-weight: bold;
        }

        @keyframes blink {
            from { border-color: var(--terminal-green); }
            to { border-color: #ff0055; box-shadow: 0 0 25px #ff0055; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="logo-title">👑 صوت صدى الهم</div>
        <div class="logo-subtitle">// نظام المنبهات المتعددة والصوت المخصص</div>
        
        <div class="clock-display" id="digitalClock">00:00:00</div>

        <!-- قسم الصوت المخصص (تسجيل أو رفع ملف) -->
        <div class="section">
            <label>1. مصدر الصوت (تسجيل صوت أو اختيار ملف):</label>
            <button id="recordBtn" type="button" onclick="toggleRecording()">بدء التسجيل 🎙️</button>
            <button id="playRecordBtn" type="button" onclick="playRecording()" disabled>استماع 🔊</button>
            <div id="recordStatus" style="font-size: 0.75rem; margin-top: 5px; color: #00cc55;">لم يتم اختيار أو تسجيل صوت بعد</div>
            
            <label style="margin-top: 8px;">أو ارفع ملف صوتي (MP3/WAV):</label>
            <input type="file" id="audioFileInput" accept="audio/*" onchange="handleAudioFile(this)">
        </div>

        <!-- قسم إضافة منبه جديد -->
        <div class="section">
            <label for="alarmTimeInput">2. حدد وقت المنبه:</label>
            <input type="time" id="alarmTimeInput">
            <button type="button" onclick="addAlarm()" style="width:100%; margin-top:5px; background:var(--terminal-green); color:#000;">إضافة منبه جديد ⏰</button>
        </div>

        <!-- قائمة المنبهات المفعلة -->
        <div class="section" style="text-align: center;">
            <label>المنبهات النشطة حالياً:</label>
            <div class="alarms-list" id="alarmsListContainer">
                <span style="font-size: 0.75rem; color: #777;">لا توجد منبهات مفعلة</span>
            </div>
        </div>

        <!-- زر إيقاف المنبه عند الرنين (مخفي افتراضياً) -->
        <div id="wakeUpContainer">
            <div id="alarmAlertTitle" style="color:#ff0055; font-weight:bold; margin-bottom:10px;">🚨 حان وقت صدى الهم!</div>
            <button id="wakeUpStopBtn" type="button" onclick="stopAlarmRing()">🛑 استيقظت! إيقاف المنبه</button>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let currentAudioBlob = null; // سيحمل الصوت المسجل أو المرفوع
        let activeAudioObject = null;
        let alarms = []; // مصفوفة لتخزين المنبهات المتعددة
        let currentlyRingingAlarmId = null;

        document.addEventListener("DOMContentLoaded", () => {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            // استعادة المنبهات من الذاكرة المحلية
            const savedAlarms = localStorage.getItem('myAlarmsList');
            if (savedAlarms) {
                try {
                    alarms = JSON.parse(savedAlarms);
                    renderAlarmsList();
                } catch(e) {
                    alarms = [];
                }
            }

            // استعادة الصوت المحفوظ إن وجد
            const savedAudioData = localStorage.getItem('myAlarmAudioBase64');
            if (savedAudioData) {
                fetch(savedAudioData)
                    .then(res => res.blob())
                    .then(blob => {
                        currentAudioBlob = blob;
                        setupAudioObject(blob);
                        document.getElementById('recordStatus').innerText = "تم استعادة الصوت المحفوظ بنجاح ✅";
                        document.getElementById('playRecordBtn').disabled = false;
                    });
            }
        });

        // تحديث الساعة والتحقق من المنبهات كل ثانية
        function updateClock() {
            try {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const clockElem = document.getElementById('digitalClock');
                if (clockElem) {
                    clockElem.innerText = `${hours}:${minutes}:${seconds}`;
                }

                // فحص كل المنبهات المسجلة
                if (alarms.length > 0 && !currentlyRingingAlarmId) {
                    const currentTimeStr = `${hours}:${minutes}`;
                    alarms.forEach(alarm => {
                        if (alarm.time === currentTimeStr && seconds === "0" && !alarm.triggeredToday) {
                            alarm.triggeredToday = true;
                            triggerAlarm(alarm);
                        }
                    });
                    
                    // إعادة تعيين حالة التنبيه لليوم التالي عند تغير الدقيقة
                    if (seconds !== "0") {
                        alarms.forEach(alarm => {
                            if (alarm.time !== currentTimeStr) {
                                alarm.triggeredToday = false;
                            }
                        });
                    }
                }
            } catch (e) {
                console.error("خطأ في تحديث الوقت:", e);
            }
        }
        setInterval(updateClock, 1000);

        // التعامل مع رفع ملف صوتي خارجي
        function handleAudioFile(input) {
            const file = input.files[0];
            if (file) {
                currentAudioBlob = file;
                setupAudioObject(file);
                document.getElementById('recordStatus').innerText = `تم رفع الملف: ${file.name} ✅`;
                document.getElementById('playRecordBtn').disabled = false;

                // حفظ الصوت في LocalStorage بصيغة Base64
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('myAlarmAudioBase64', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        // تجهيز كائن الصوت للتشغيل
        function setupAudioObject(blob) {
            const audioUrl = URL.createObjectURL(blob);
            activeAudioObject = new Audio(audioUrl);
            activeAudioObject.loop = true;
        }

        // تسجيل الصوت عبر الميكروفون
        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const statusDiv = document.getElementById('recordStatus');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        setupAudioObject(currentAudioBlob);
                        document.getElementById('playRecordBtn').disabled = false;
                        statusDiv.innerText = "حالة التسجيل: تم تسجيل الصوت بنجاح! ✅";

                        // حفظ الصوت المسجل
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            localStorage.setItem('myAlarmAudioBase64', e.target.result);
                        };
                        reader.readAsDataURL(currentAudioBlob);
                    };

                    mediaRecorder.start();
                    btn.innerText = "إيقاف التسجيل ⏹️";
                    btn.classList.add("active");
                    statusDiv.innerText = "جاري التسجيل الآن... تحدث بوضوح";
                } catch (err) {
                    alert("خطأ: يرجى التأكد من منح المتصفح صلاحية الوصول إلى الميكروفون.");
                }
            } else {
                mediaRecorder.stop();
                btn.innerText = "بدء التسجيل 🎙️";
                btn.classList.remove("active");
            }
        }

        function playRecording() {
            if (activeAudioObject) {
                activeAudioObject.currentTime = 0;
                activeAudioObject.play().catch(e => console.log("تعذر التشغيل المباشر"));
            }
        }

        // إضافة منبه جديد للمصفوفة
        function addAlarm() {
            const timeInput = document.getElementById('alarmTimeInput').value;
            if (!timeInput) {
                alert("الرجاء تحديد وقت المنبه أولاً!");
                return;
            }
            if (!currentAudioBlob) {
                alert("الرجاء تسجيل أو رفع صوت المنبه أولاً!");
                return;
            }

            const newAlarm = {
                id: Date.now().toString(),
                time: timeInput,
                triggeredToday: false
            };

            alarms.push(newAlarm);
            saveAndRefreshAlarms();
            document.getElementById('alarmTimeInput').value = "";
        }

        // حذف منبه محدد
        function deleteAlarm(id) {
            alarms = alarms.filter(a => a.id !== id);
            saveAndRefreshAlarms();
        }

        // حفظ القائمة وتحديث واجهة المستخدم
        function saveAndRefreshAlarms() {
            localStorage.setItem('myAlarmsList', JSON.stringify(alarms));
            renderAlarmsList();
        }

        // عرض المنبهات في القائمة
        function renderAlarmsList() {
            const container = document.getElementById('alarmsListContainer');
            if (alarms.length === 0) {
                container.innerHTML = `<span style="font-size: 0.75rem; color: #777;">لا توجد منبهات مفعلة</span>`;
                return;
            }

            container.innerHTML = "";
            alarms.forEach(alarm => {
                container.innerHTML += `
                    <div class="alarm-item">
                        <span>⏰ ${alarm.time}</span>
                        <button type="button" onclick="deleteAlarm('${alarm.id}')">حذف ❌</button>
                    </div>
                `;
            });
        }

        // إطلاق المنبه الرنان
        function triggerAlarm(alarm) {
            currentlyRingingAlarmId = alarm.id;
            
            if (Notification.permission === "granted") {
                new Notification("🚨 حان وقت صدى الهم!", {
                    body: `منبه الساعة ${alarm.time} يعمل الآن!`,
                    icon: "https://cdn-icons-png.flaticon.com/512/3236/3236746.png"
                });
            }

            if (activeAudioObject) {
                activeAudioObject.currentTime = 0;
                activeAudioObject.play().catch(e => {
                    console.log("يتطلب المتصفح تفاعلاً لتشغيل الصوت.");
                });
            }

            document.getElementById('alarmAlertTitle').innerText = `🚨 حان وقت صدى الهم! (${alarm.time})`;
            document.getElementById('wakeUpContainer').style.display = 'block';
        }

        // إيقاف الرنين الحالي
        function stopAlarmRing() {
            if (activeAudioObject) {
                activeAudioObject.pause();
                activeAudioObject.currentTime = 0;
            }
            currentlyRingingAlarmId = null;
            document.getElementById('wakeUpContainer').style.display = 'none';
        }
    </script>
</body>
</html>
