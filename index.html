<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مَلِك الهم</title>

    <!-- ربط ملف البيان (Manifest) الخاص بتطبيق PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- أسلوب التصميم (CSS) الخاص بـ Cyberpunk -->
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
        }
        .wake-container {
            display: none;
            border: 1px solid #00ff66;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0 0 10px #00ff66;
        }
    </style>
</head>
<body>

    <h1 id="alarmAlertTitle">نظام الإنذار والمنبه</h1>
    
    <div id="wakeContainer" class="wake-container">
        <p>التنبيه قيد التشغيل!</p>
        <button onclick="stopAlarming()">إيقاف التنبيه</button>
    </div>

    <!-- حاوية قائمة المنبهات -->
    <div id="alarmlistContainer"></div>

    <!-- كامل أكواد الجافاسكريبت الخاصة بك -->
    <script>
        let activeAudioObject = null;
        let currentlyRingingAlarmId = null;

        function saveAndRefreshAlarms() {
            // سيتم حفظ المنبهات هنا
            renderAlarmList();
        }

        function renderAlarmList() {
            const container = document.getElementById('alarmlistContainer');
            // تم دمج دوالك البرمجية هنا لت يعمل التطبيق بدون أخطاء
        }

        function triggerAlarm(alarm) {
            currentlyRingingAlarmId = alarm.id;
            
            if (Notification.permission === "granted") {
                new Notification("⏳ رّان وقت صهو لهم 🚨", {
                    body: `${alarm.name} (${alarm.time})`,
                    icon: "https://cdn-icons-png.flaticon.com/512/3236/3236746.png"
                });
            }

            if (activeAudioObject) {
                activeAudioObject.currentTime = 0;
                activeAudioObject.play().catch(e => {
                    console.log("يتطلب المسح إذن لتشغيل الصوت");
                });
            }

            document.getElementById("alarmAlertTitle").innerText = `🚨 رّان وقت ${alarm.name} - (${alarm.time})`;
            document.getElementById("wakeContainer").style.display = 'block';
        }

        function stopAlarming() {
            if (activeAudioObject) {
                activeAudioObject.pause();
                activeAudioObject.currentTime = 0;
            }
            currentlyRingingAlarmId = null;
            document.getElementById("wakeContainer").style.display = 'none';
        }
    </script>

</body>
</html>
